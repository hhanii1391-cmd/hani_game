<!DOCTYPE html>
<html>
<head>
  <title>بازی حدس عدد</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #e8f5e9;
      font-family: Tahoma;
      text-align: center;
      padding: 50px;
    }
    h1 { color: #2e7d32; }
    input {
      padding: 10px;
      font-size: 16px;
      border: 2px solid #2e7d32;
      border-radius: 8px;
      width: 100px;
      text-align: center;
    }
    button {
      background-color: #2e7d32;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 10px;
    }
    #نتیجه {
      margin-top: 20px;
      font-size: 20px;
      color: #333;
    }
    #تلاش {
      margin-top: 10px;
      color: #777;
      font-size: 14px;
    }
    #امتیاز {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
      color: #1b5e20;
    }
    #سطح {
      margin-top: 10px;
      font-size: 18px;
      color: #2e7d32;
    }
    #تایمر {
      margin-top: 10px;
      font-size: 18px;
      color: #c62828;
      font-weight: bold;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-10px); }
      100% { transform: translateX(0); }
    }
    .shake {
      animation: shake 0.3s;
    }
  </style>
</head>
<body>
  <h1>🎮 بازی حدس عدد</h1>
  <div id="امتیاز">امتیاز: ۰</div>
  <div id="سطح">سطح: ۱</div>
  <div id="تایمر">⏱️ زمان: ۳۰</div>
  <p id="راهنما">یه عدد بین ۱ تا ۱۰ حدس بزن:</p>
  <input type="number" id="حدس" min="1" max="10">
  <button onclick="بررسی()">حدس بزن!</button>
  <div id="نتیجه"></div>
  <div id="تلاش"></div>

  <script>
    let تعدادتلاش = 0;
    let سطح = 1;
    let زمان = 30;
    let تایمر;

    let امتیاز = Number(localStorage.getItem("امتیاز")) || 0;
    let سطحذخیره = Number(localStorage.getItem("سطح")) || 1;

    سطح = سطحذخیره;

    let سقف = سطح * 10;
    let عدددرست = Math.floor(Math.random() * سقف) + 1;

    let audioContext = new (window.AudioContext || window.webkitAudioContext)();

    function پخشصدا(فرکانس, مدت) {
      let oscillator = audioContext.createOscillator();
      let gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.frequency.value = فرکانس;
      oscillator.type = "sine";

      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + مدت);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + مدت);
    }

    function بلرزون() {
      document.body.classList.add("shake");
      setTimeout(() => {
        document.body.classList.remove("shake");
      }, 300);
    }

    function شروع تایمر() {
      زمان = 30;
      document.getElementById("تایمر").innerHTML = "⏱️ زمان: " + زمان;
      document.getElementById("حدس").disabled = false;

      clearInterval(تایمر);
      تایمر = setInterval(function() {
        زمان = زمان - 1;
        document.getElementById("تایمر").innerHTML = "⏱️ زمان: " + زمان;

        if (زمان <= 0) {
          clearInterval(تایمر);
          پایان وقت();
        }
      }, 1000);
    }

    function پایان وقت() {
      document.getElementById("نتیجه").innerHTML = "⏰ وقت تموم شد! عدد درست " + عدددرست + " بود.";
      document.getElementById("حدس").disabled = true;
      پخشصدا(150, 0.5);
      بلرزون();

      setTimeout(function() {
        // شروع دوباره بعد از ۳ ثانیه
        عدددرست = Math.floor(Math.random() * سقف) + 1;
        تعدادتلاش = 0;
        document.getElementById("نتیجه").innerHTML = "بازی جدید شروع شد! یه عدد دیگه حدس بزن.";
        شروع تایمر();
      }, 3000);
    }

    function بررسی() {
      let حدسکاربر = document.getElementById("حدس").value;
      let نتیجه = document.getElementById("نتیجه");
      let تلاش = document.getElementById("تلاش");

      if (حدسکاربر === "") {
        نتیجه.innerHTML = "لطفاً یه عدد وارد کن.";
        return;
      }

      تعدادتلاش = تعدادتلاش + 1;

      if (حدسکاربر == عدددرست) {
        let امتیازایندوره = 0;

        if (تعدادتلاش == 1) {
          امتیازایندوره = 100;
        } else if (تعدادتلاش == 2) {
          امتیازایندوره = 70;
        } else if (تعدادتلاش == 3) {
          امتیازایندوره = 50;
        } else {
          امتیازایندوره = 20;
        }

        امتیاز = امتیاز + امتیازایندوره;
        document.getElementById("امتیاز").innerHTML = "امتیاز: " + امتیاز;

        نتیجه.innerHTML = "🎉 آفرین! توی " + تعدادتلاش + " تلاش درست حدس زدی! (+" + امتیازایندوره + " امتیاز)";
        تلاش.innerHTML = "بازی جدید شروع شد! یه عدد دیگه حدس بزن.";

        پخشصدا(523, 0.15);
        setTimeout(() => پخشصدا(659, 0.15), 150);
        setTimeout(() => پخشصدا(784, 0.3), 300);

        سطح = سطح + 1;
        document.getElementById("سطح").innerHTML = "سطح: " + سطح;

        سقف = سطح * 10;
        عدددرست = Math.floor(Math.random() * سقف) + 1;
        تعدادتلاش = 0;

        document.getElementById("راهنما").innerHTML = "یه عدد بین ۱ تا " + سقف + " حدس بزن:";
        نتیجه.innerHTML += " برو برای سطح " + سطح + " (عدد بین ۱ تا " + سقف + ")";

        localStorage.setItem("امتیاز", امتیاز);
        localStorage.setItem("سطح", سطح);

        شروع تایمر();

      } else if (حدسکاربر > عدددرست) {
        نتیجه.innerHTML = "⬇️ عددت بزرگه، یه کم کمتر حدس بزن.";
        تلاش.innerHTML = "تلاش: " + تعدادتلاش;
        پخشصدا(200, 0.2);
        بلرزون();
      } else {
        نتیجه.innerHTML = "⬆️ عددت کوچیکه، یه کم بیشتر حدس بزن.";
        تلاش.innerHTML = "تلاش: " + تعدادتلاش;
        پخشصدا(200, 0.2);
        بلرزون();
      }
    }

    // نمایش مقادیر ذخیره‌شده وقتی صفحه باز می‌شه
    document.getElementById("امتیاز").innerHTML = "امتیاز: " + امتیاز;
    document.getElementById("سطح").innerHTML = "سطح: " + سطح;
    document.getElementById("راهنما").innerHTML = "یه عدد بین ۱ تا " + سقف + " حدس بزن:";

    // شروع تایمر از همون اول
    شروع تایمر();
  </script>
</body>
</html>
